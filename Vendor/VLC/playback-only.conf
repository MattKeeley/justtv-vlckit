# JustTV playback-only profile. Source the pinned upstream defaults first.
# Keep demuxers/decoders, HTTP(S)/HLS/RTSP, local files, subtitles and Apple A/V.
. "${JUSTTV_VLC_SOURCE_ROOT:?}/extras/package/apple/build.conf"

export VLC_DEPLOYMENT_TARGET_IOS="18.0"
export VLC_DEPLOYMENT_TARGET_IOS_SIMULATOR="18.0"
export VLC_DEPLOYMENT_TARGET_TVOS="18.0"
export VLC_DEPLOYMENT_TARGET_TVOS_SIMULATOR="18.0"

# No encoding/transcoding, LAN browsing/casting, archive browsing or metadata
# editing. Native Apple AirPlay remains outside this compatibility framework.
justtv_contrib_options=()
for option in "${VLC_CONTRIB_OPTIONS_BASE[@]}"; do
    case "$option" in
        --enable-libdsm|--enable-taglib|--enable-opencv4|--enable-zvbi) ;;
        *) justtv_contrib_options+=("$option") ;;
    esac
done
VLC_CONTRIB_OPTIONS_BASE=("${justtv_contrib_options[@]}")
VLC_CONTRIB_OPTIONS_BASE+=(
    # JPEG decoder formerly arrived transitively through OpenCV.
    --enable-jpeg
    --disable-sout
    --disable-libdsm --disable-smb2 --disable-nfs --disable-ssh2
    --disable-upnp --disable-microdns --disable-protobuf
    --disable-libarchive --disable-taglib --disable-opencv4 --disable-zvbi
)
VLC_CONFIG_OPTIONS_BASE+=(
    --disable-sout --disable-chromecast
    --disable-upnp --disable-upnp-server --disable-microdns --disable-avahi
    --disable-smbclient --disable-smb2 --disable-dsm --disable-nfs --disable-sftp
    --disable-archive --disable-taglib --disable-opencv
    # Retain LGPL text teletext fallback; remove zvbi GPL-only packet code.
    --disable-zvbi --enable-telx
)
# Built-in discovery modules do not all have configure switches.
VLC_MODULE_REMOVAL_LIST_BASE+=(
    bonjour sap podcasts avahi microdns upnp smb2 dsm sftp nfs
)
